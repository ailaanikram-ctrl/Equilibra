function dashHTML(an){const D=dstat(),sc=D.score,C=2*Math.PI*46,L=v=>Math.max(0,Math.min(100,(v-6)/18*100)),hh=new Date().toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit'});

const segs=[];const P=D.pts;for(let i=1;i<P.length;i++){const gap=P[i]-P[i-1];segs.push(`<i class="tl-seg" style="left:${L(P[i-1])}%;width:${L(P[i])-L(P[i-1])}%;--d:${300+i*200}ms;background:${gap<=4?'var(--daun)':gap<=5.5?'var(--kunyit)':'#B9821F'}"></i>`)}
const tl=`<div class="tl"><div class="tl-line"></div>${segs.join('')}${D.hrs.map((x,i)=>`<i class="tl-m" style="left:${L(x)}%;--d:${500+i*160}ms">${I('check',12)}</i><em class="tl-t" style="left:${L(x)}%">${fmt(x).replace(':00','')}</em>`).join('')}<span class="tl-now" style="left:${L(D.h)}%" title="Now"></span>${[[6,'6a'],[9,'9a'],[12,'12p'],[15,'3p'],[18,'6p'],[21,'9p'],[24,'12a']].map(([x,l])=>`<span class="tl-h" style="left:${L(x)}%">${l}</span>`).join('')}</div>`;

const H=D.H,W=300,Hh=90,X=i=>H.length>1?10+i*(W-20)/(H.length-1):W/2,Y=v=>Hh-8-Math.min(v,1.3)/1.3*(Hh-18);
const line=(k,c)=>`<path class="ln" pathLength="1" stroke="var(${c})" d="${H.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join(' ')}"/>${H.map((p,i)=>`<circle class="dot" style="--d:${900+i*120}ms" cx="${X(i).toFixed(1)}" cy="${Y(p[k]).toFixed(1)}" r="3.6" fill="var(${c})"/>`).join('')}`;
const avg=k=>H.length?Math.round(H.reduce((a,p)=>a+p[k],0)/H.length*100):0;
const trend=H.length>=2?`<svg class="spark" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Protein and fibre as a share of target over your last ${H.length} logged days"><line class="tg1" x1="0" x2="${W}" y1="${Y(1).toFixed(1)}" y2="${Y(1).toFixed(1)}"/>${line('p','--sambal')}${line('f','--daun')}</svg><div class="legs"><span style="--c:var(--sambal)">Protein avg ${avg('p')}%</span><span style="--c:var(--daun)">Fibre avg ${avg('f')}%</span></div><p class="muted sm" style="margin-top:6px">Dashed line is your target. Based on ${H.length} logged days.</p>`:`<p class="muted">Not enough logged days yet (${H.length} of 2). Your trend appears after a couple of days of logging.</p>`;
const imp=D.imp.length?D.imp.map((x,i)=>`<div class="imp rv" style="--d:${400+i*150}ms"><span class="tile" style="--d:${500+i*150}ms">${I(x[1],22)}</span><div class="grow"><b>${x[2]}</b><p class="muted sm">${x[3]}</p></div><button class="btn sm" onclick="${x[5]}">${x[4]}</button></div>`).join(''):`<p class="muted">You’re on pace. Nothing needs fixing right now.</p>`;
return `<div class="${an?'an':''}"><div class="dbhead rv"><div><h2>Live dashboard</h2><p>From your logs today and recent days</p></div><div class="live" id="lv"><i></i><span id="ut">Live ${hh}</span></div></div>

uku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":4,\"title\":\"Nasi tumpang\",\"ingredients\":[\"2 cawan nasi putih\",\"1 cawan kelapa parut sangrai\",\"4 ulas bawang putih\",\"5 cili kering\",\"1 cawan ikan kembung rebus\",\"garam\"],\"steps\":[\"Kisar cili dan bawang putih, tumis hingga wangi.\",\"Masukkan ikan suiran dan garam.\",\"Gaul bersama kelapa sangrai.\",\"Hidang bersama nasi.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":5,\"title\":\"Nasi kerabu\",\"ingredients\":[\"2 cawan beras\",\"1 sudu besar bunga telang\",\"1 cawan kelapa parut sangrai\",\"4 helai daun kesum\",\"1 biji timun\",\"100 g tauge\",\"1 batang serai\",\"ikan goreng dan solok lada untuk hidang\"],\"steps\":[\"Rendam bunga telang dalam air panas, guna airnya untuk menanak beras.\",\"Tanak beras dengan serai hingga masak.\",\"Susun nasi dengan tauge, timun, daun kesum dan kelapa sangrai.\",\"Hidang dengan ikan goreng, solok lada dan budu.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":6,\"title\":\"Nasi dagang\",\"ingredients\":[\"2 cawan beras\",\"1 cawan santan\",\"1 sudu teh halba\",\"1 biji bawang merah\",\"2 ulas bawang putih\",\"1 cm halia\",\"garam\"],\"steps\":[\"Rendam beras 1 jam, toskan.\",\"Tumis bawang, bawang putih, halia dan halba, masukkan beras.\",\"Tuang santan dan air secukupnya, masak hingga kering.\",\"Hidang dengan gulai ikan tongkol.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":7,\"title\":\"Nasi himpit\",\"ingredients\":[\"2 cawan beras\",\"4 cawan air\",\"1 sudu teh garam\"],\"steps\":[\"Masak beras dan air hingga jadi bubur pekat.\",\"Tuang dalam loyang, ratakan.\",\"Sejukkan hingga keras, potong empat segi.\",\"Hidang dengan kuah kacang atau lauk.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":8,\"title\":\"Nasi goreng\",\"ingredients\":[\"3 cawan nasi sejuk\",\"2 biji telur\",\"3 ulas bawang putih\",\"1 sudu besar sos cili\",\"1 sudu besar kicap manis\",\"100 g udang atau ayam\",\"2 sudu besar minyak\",\"garam\"],\"steps\":[\"Panaskan minyak, tumis bawang putih hingga wangi.\",\"Masukkan udang atau ayam, masak hingga berubah warna.\",\"Pecahkan telur, kacau, masukkan nasi, sos cili dan kicap.\",\"Gaul rata api besar 3 minit, rasa garam dan hidang.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":9,\"title\":\"Nasi ulam\",\"ingredients\":[\"3 cawan nasi\",\"1 cawan herba ulam dihiris\",\"\u00bd cawan kelapa sangrai\",\"1 sudu besar ikan bilis goreng\",\"garam\",\"sambal belacan\"],\"steps\":[\"Hiris halus daun ulam.\",\"Gaul nasi dengan herba.\",\"Masukkan kelapa sangrai, ikan bilis dan garam.\",\"Hidang dengan sambal belacan.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":10,\"title\":\"Ketupat\",\"ingredients\":[\"2 cawan beras\",\"4 cawan air\",\"1 sudu teh garam\",\"daun kelapa muda untuk anyaman\"],\"steps\":[\"Anyam daun kelapa menjadi sarung ketupat.\",\"Isi beras separuh penuh.\",\"Rebus 3 jam hingga padat.\",\"Toskan, sejukkan dan potong.\",\"Hidang dengan kuah kacang atau rendang.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":11,\"title\":\"Lemang\",\"ingredients\":[\"3 cawan beras pulut\",\"2 cawan santan\",\"1 sudu teh garam\",\"daun pisang\",\"buluh lemang\"],\"steps\":[\"Rendam pulut 3 jam, toskan.\",\"Alas buluh dengan daun pisang.\",\"Isi pulut, tuang santan bergaram.\",\"Bakar atas bara 4 jam sambil diputar.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":12,\"title\":\"Pulut kukus dalam periuk kera\",\"ingredients\":[\"2 cawan pulut\",\"1 cawan santan\",\"\u00bd sudu teh garam\",\"daun pisang\"],\"steps\":[\"Rendam pulut 2 jam.\",\"Gaul dengan santan dan garam.\",\"Kukus dalam periuk kera 30 minit.\",\"Hidang dengan serunding.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":13,\"title\":\"Pulut panggang\",\"ingredients\":[\"2 cawan pulut\",\"1 cawan santan\",\"100 g udang kisar\",\"1 sudu besar sambal tumis\",\"daun pisang\"],\"steps\":[\"Kukus pulut dengan santan.\",\"Gaul udang dengan sambal.\",\"Isi dalam pulut, bungkus daun pisang.\",\"Panggang hingga wangi.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":14,\"title\":\"Mi Mamak\",\"ingredients\":[\"300 g mi kuning\",\"2 biji telur\",\"100 g udang\",\"2 ketul tauhu goreng\",\"1 biji kentang rebus\",\"2 ulas bawang putih\",\"2 sudu besar sos cili\",\"2 sudu besar kicap manis\",\"taugeh dan sawi\",\"minyak\"],\"steps\":[\"Tumis bawang putih, masukkan udang dan sos cili.\",\"Masukkan mi, kicap manis dan sedikit air.\",\"Tambah sawi, taugeh, tauhu dan kentang.\",\"Tolak ke tepi, goreng telur, gaul rata dan hidang dengan limau.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":15,\"title\":\"Laksa asam\",\"ingredients\":[\"500 g ikan kembung\",\"4 keping asam keping\",\"10 cili kering\",\"1 biji bawang besar\",\"3 batang serai\",\"2 cm lengkuas\",\"daun kesum\",\"1 sudu besar belacan\",\"400 g laksa putih\",\"timun, nanas, bunga kantan\"],\"steps\":[\"Rebus ikan, suir isinya dan asingkan.\",\"Kisar cili, bawang, serai, lengkuas dan belacan, tumis.\",\"Masukkan air rebusan ikan, asam keping dan daun kesum, reneh 30 minit.\",\"Masukkan isi ikan, hidang atas laksa dengan sayuran.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":16,\"title\":\"Char kuey teow (versi Resipi Sihat KKM)\",\"ingredients\":[\"350 g (3 cawan) kuey teow\",\"200 g taugeh\",\"200 g daun sawi\",\"150 g udang, dibuang kepala, perut, ekor dan kulit\",\"20 g kicap pekat\",\"10 g kicap cair\",\"30 g minyak sayuran\",\"3 g lada sulah\",\"3 g garam\",\"Ditumbuk: 30 g bawang merah, 15 g bawang putih, 25 g cili merah\",\"Hiasan: 25 g cili merah, 1 biji limau kasturi\",\"Sos cili: 10 g bawang putih, 100 g cili merah, 60 g sos tomato, 3 g garam\"],\"steps\":[\"Tumis bahan tumbuk hingga kuning, masukkan udang.\",\"Masukkan kicap, sawi dan taugeh, kacau.\",\"Masukkan kuey teow, garam dan lada sulah, gaul rata.\",\"Hias dengan cili dan limau kasturi, hidang panas bersama sos cili.\"],\"source\":\"Kementerian Kesihatan Malaysia, Resipi Sihat Jilid 1/2011 (analisis nutrien UKM diet4)\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":false,\"source_url\":\"https://www2.moh.gov.my/moh/resources/Penerbitan/Rujukan/NCD/Diabetes/02.Layout_Resepi_Sihat_.pdf\",\"web_sourced\":true},{\"id\":17,\"title\":\"Laksa Johor\",\"ingredients\":[\"400 g spageti\",\"500 g ikan tenggiri\",\"1 cawan kelapa parut sangrai\",\"5 cili kering\",\"3 batang serai\",\"2 cm kunyit\",\"2 cawan santan\",\"taugeh dan daun kesum\"],\"steps\":[\"Rebus ikan, suir isinya.\",\"Kisar kelapa, cili, serai dan kunyit.\",\"Tumis, masukkan stok ikan dan santan, reneh 20 minit.\",\"Hidang atas spageti dengan sayuran.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":18,\"title\":\"Rendang\",\"ingredients\":[\"1 kg daging batang pinang\",\"2 biji kelapa (santan pekat)\",\"4 batang serai\",\"5 helai daun limau purut\",\"2 keping asam gelugor\",\"1 cawan kerisik\",\"20 cili kering\",\"5 biji bawang merah\",\"4 ulas bawang putih\",\"3 cm halia\",\"3 cm lengkuas\",\"garam dan gula\"],\"steps\":[\"Kisar cili, bawang, bawang putih, halia dan lengkuas.\",\"Rebus daging dengan santan, rempah, serai, limau purut dan asam gelugor.\",\"Kacau perlahan 2 jam hingga santan menyusut.\",\"Masukkan kerisik, garam dan gula, masak hingga kering dan gelap.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":19,\"title\":\"Serunding\",\"ingredients\":[\"500 g daging\",\"2 cawan kelapa parut\",\"3 batang serai\",\"8 cili kering\",\"5 biji bawang merah\",\"1 sudu besar gula\",\"garam\"],\"steps\":[\"Rebus daging, suir halus.\",\"Kisar rempah dan tumis.\",\"Masukkan daging dan kelapa, kacau api kecil 1 jam.\",\"Masak hingga kering dan rangup.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":20,\"title\":\"Ayam percik\",\"ingredients\":[\"1.5 kg kepak ayam\",\"1-2 sudu teh serbuk cili\",\"2 sudu teh serbuk kunyit\",\"1 sudu teh gula\",\"garam\",\"60 ml minyak\",\"8-10 cili kering, direndam\",\"4 buah keras\",\"3 ulas bawang putih\",\"5 bawang merah\",\"1 serai untuk pes\",\"halia\",\"lengkuas\",\"2 serai tambahan\",\"2 keping asam gelugor\",\"2 daun limau purut\",\"2 bunga cengkih\",\"3 buah pelaga\",\"1 sudu besar gula\",\"400 ml santan\",\"250 ml air\"],\"steps\":[\"Gaul bahan perapan dengan ayam sampai semua bahagian kena. Simpan dalam peti sejuk sekurang-kurangnya 2 jam; sumber mencadangkan semalaman untuk rasa lebih meresap.\",\"Kisar bahan pes. Guna sedikit air rendaman cili kalau pengisar susah bergerak.\",\"Panaskan minyak. Masukkan pes, serai, asam gelugor, daun limau, bunga cengkih dan buah pelaga. Tumis 5-6 minit sampai naik bau.\",\"Masukkan gula, santan dan air. Reneh sambil kacau sekali-sekala 5-7 minit sampai kuah mula pekat. Perasakan kemudian biarkan kuah sejuk.\",\"Panaskan pemanggang. Letak ayam bahagian kulit dahulu. Bakar sambil sapu kuah percik dan balikkan ayam sekali-sekala.\",\"Masak kira-kira 20 minit atau sampai ayam masak dan permukaan ada kesan bakar yang cantik. Sumber menyebut jus pada bahagian tebal perlu keluar jernih apabila dicucuk.\"],\"source\":\"SBS Food - Ayam percik, Tony Tan, 20 November 2023\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null},{\"id\":21,\"title\":\"Manok pansoh\",\"ingredients\":[\"1 ekor ayam kampung dipotong\",\"10 biji bawang kecil\",\"4 batang serai\",\"3 cm halia\",\"daun pansoh atau daun pisang\",\"2 sudu teh garam\",\"1 batang buluh\"],\"steps\":[\"Gaul ayam dengan serai ketuk, halia, bawang dan garam.\",\"Masukkan dalam buluh berlapik daun, tambah \u00bd cawan air.\",\"Bakar atas bara 1 jam sambil diputar.\",\"Hidang bersama nasi.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":22,\"title\":\"Masak asam pedas\",\"ingredients\":[\"600 g ikan tenggiri\",\"8 cili kering\",\"1 biji bawang besar\",\"3 cm halia\",\"2 batang serai\",\"2 keping asam keping\",\"5 biji bendi\",\"2 biji tomato\",\"daun kesum\",\"garam\"],\"steps\":[\"Kisar cili, bawang, halia dan serai.\",\"Tumis hingga pecah minyak, tuang 3 cawan air.\",\"Masukkan asam keping dan daun kesum, reneh 5 minit.\",\"Masukkan ikan, bendi dan tomato, masak 10 minit, rasa garam.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":23,\"title\":\"Gulai tempoyak ikan patin\",\"ingredients\":[\"500 g ikan patin\",\"4 sudu besar tempoyak\",\"8 cili padi\",\"3 biji bawang merah\",\"2 batang serai\",\"1 sudu teh kunyit\",\"daun kesum\"],\"steps\":[\"Kisar cili, bawang dan kunyit.\",\"Rebus bersama serai dan tempoyak 5 minit.\",\"Masukkan ikan dan daun kesum.\",\"Reneh 10 minit, rasa garam.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":24,\"title\":\"Ikan bakar\",\"ingredients\":[\"2 ekor ikan pari atau kembung\",\"5 cili merah\",\"3 biji bawang merah\",\"3 ulas bawang putih\",\"2 cm kunyit\",\"1 sudu besar air asam jawa\",\"garam\",\"daun pisang\"],\"steps\":[\"Kisar cili, bawang, bawang putih dan kunyit, campur asam jawa dan garam.\",\"Sapu pada ikan, balut dengan daun pisang.\",\"Bakar atas bara 8 minit setiap sisi.\",\"Hidang dengan limau dan nasi.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":25,\"title\":\"Gulai lemak umbut\",\"ingredients\":[\"300 g umbut kelapa\",\"1 cawan santan\",\"5 cili api\",\"3 biji bawang merah\",\"2 cm kunyit\",\"1 batang serai\",\"garam\"],\"steps\":[\"Hiris umbut, rendam sebentar.\",\"Kisar cili, bawang dan kunyit, rebus bersama serai.\",\"Masukkan umbut hingga lembut.\",\"Tuang santan, reneh 5 minit.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":26,\"title\":\"Kari kepala ikan\",\"ingredients\":[\"1 kepala ikan merah\",\"2 sudu besar serbuk kari ikan\",\"1 biji bawang\",\"3 ulas bawang putih\",\"3 biji bendi\",\"2 biji tomato\",\"1 sudu besar asam jawa\",\"1 cawan santan\"],\"steps\":[\"Tumis bawang dan bawang putih, masukkan serbuk kari.\",\"Tuang air dan asam jawa, didihkan.\",\"Masukkan kepala ikan, bendi dan tomato.\",\"Masukkan santan, reneh 10 minit.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":27,\"title\":\"Kurma daging\",\"ingredients\":[\"500 g daging\",\"1 cawan yogurt\",\"4 sudu besar serbuk kurma\",\"2 biji bawang\",\"1 cawan santan\",\"kayu manis, bunga lawang\",\"garam\"],\"steps\":[\"Perap daging dengan yogurt.\",\"Tumis rempah, serbuk kurma dan bawang.\",\"Masukkan daging dan air, reneh 1 jam.\",\"Masukkan santan, masak hingga pekat.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":28,\"title\":\"Pajeri\",\"ingredients\":[\"2 biji nanas\",\"1 cawan gula\",\"2 batang kayu manis\",\"1 sudu besar serbuk kari\",\"5 cili kering\",\"1 biji bawang\",\"garam\"],\"steps\":[\"Tumis bawang, cili dan serbuk kari.\",\"Masukkan nanas dan kayu manis.\",\"Tambah air dan gula, reneh hingga pekat.\",\"Rasa garam.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":29,\"title\":\"Daging dendeng\",\"ingredients\":[\"500 g daging\",\"10 cili kering\",\"5 biji bawang merah\",\"2 sudu besar asam jawa\",\"1 sudu besar gula\",\"minyak\"],\"steps\":[\"Hiris nipis daging, perap dengan rempah kisar.\",\"Jemur 3 jam.\",\"Goreng hingga garing.\",\"Hidang bersama nasi.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":30,\"title\":\"Botok-botok ikan\",\"ingredients\":[\"500 g ikan\",\"1 cawan kelapa parut\",\"5 cili\",\"3 biji bawang\",\"2 cm kunyit\",\"daun pisang\"],\"steps\":[\"Kisar kelapa dan rempah.\",\"Gaul dengan ikan.\",\"Bungkus dalam daun pisang.\",\"Kukus 30 minit.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":31,\"title\":\"Teh tarik\",\"ingredients\":[\"3 sudu besar daun teh\",\"3 cawan air\",\"\u00bd cawan susu pekat manis\",\"\u00bd cawan susu sejat\"],\"steps\":[\"Rebus air dan teh 5 minit, tapis.\",\"Campur susu pekat dan susu sejat dalam cawan.\",\"Tuang teh panas.\",\"Tarik berulang kali antara dua bekas hingga berbuih.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":32,\"title\":\"Cendol\",\"ingredients\":[\"1 cawan tepung beras\",\"2 helai daun pandan\",\"1 cawan gula Melaka\",\"1 cawan santan\",\"ais kisar\",\"kacang merah\",\"sedikit garam\"],\"steps\":[\"Kisar pandan dengan air, campur tepung beras dan masak jadi adunan.\",\"Tekan adunan melalui acuan ke dalam air ais.\",\"Cairkan gula Melaka dengan \u00bd cawan air.\",\"Susun ais, cendol, kacang merah, santan dan gula Melaka.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":33,\"title\":\"ABC\",\"ingredients\":[\"1 cawan ais kisar\",\"2 sudu besar kacang merah\",\"2 sudu besar jagung\",\"2 sudu besar cincau\",\"sirap ros\",\"susu pekat manis\"],\"steps\":[\"Susun kacang, jagung dan cincau dalam mangkuk.\",\"Letak ais kisar.\",\"Tuang sirap dan susu pekat.\",\"Hidang segera.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":34,\"title\":\"Air kelapa\",\"ingredients\":[\"1 biji kelapa muda\",\"ais batu\",\"gula (pilihan)\"],\"steps\":[\"Belah kelapa, tuang air dalam gelas.\",\"Masukkan isi kelapa muda.\",\"Tambah ais.\",\"Hidang sejuk.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":35,\"title\":\"Air selasih\",\"ingredients\":[\"1 sudu besar biji selasih\",\"2 cawan air\",\"3 sudu besar gula\",\"ais\",\"sirap ros\"],\"steps\":[\"Rendam selasih dalam air sejuk hingga kembang.\",\"Larutkan gula dalam air.\",\"Campur selasih.\",\"Tuang ais dan sirap.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":36,\"title\":\"Hinava ikan (Sabah)\",\"ingredients\":[\"1 kg ikan tenggiri segar\",\"\u00bd biji peria, dihiris halus dan digaul dengan _placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":183,\"title\":\"Masak Ikan dan Pisang dalam Buluh\",\"ingredients\":[\"500 g ikan\",\"2 biji pisang\",\"buluh\",\"garam\"],\"steps\":[\"Isi buluh.\",\"Tutup.\",\"Bakar.\",\"Hidang.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":184,\"title\":\"La-tiang\",\"ingredients\":[\"2 cawan tepung\",\"1 cawan gula\",\"kelapa\"],\"steps\":[\"Campur.\",\"Kukus.\",\"Salut.\",\"Hidang.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":185,\"title\":\"Ayam Panggang\",\"ingredients\":[\"1 ekor ayam\",\"3 sudu besar kicap\",\"2 sudu besar madu\",\"3 ulas bawang putih\",\"1 sudu besar lada hitam\",\"garam\"],\"steps\":[\"Perap ayam dengan semua bahan 3 jam.\",\"Bakar 200\u00b0C 50 minit.\",\"Sapu madu semasa bakar.\",\"Hidang panas.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":186,\"title\":\"Acar Ayam dan Telur\",\"ingredients\":[\"1/2 ekor ayam\",\"5 telur rebus\",\"5 ulas bawang putih kisar\",\"2 bawang besar kisar\",\"1 inci halia\",\"1 sudu kecil biji sawi\",\"lobak merah\",\"bawang putih, bawang merah dan cili padi tambahan\",\"1-2 senduk cili kisar\",\"2 sudu besar sos cili\",\"5 sudu besar cuka\",\"1 mangkuk kecil air\",\"1 sudu kecil serbuk perasa\",\"1 sudu kecil garam\",\"2 sudu kecil gula\",\"kunyit dan garam untuk ayam\"],\"steps\":[\"Gaul ayam dengan kunyit dan garam. Goreng sampai keemasan, angkat dan ketepikan.\",\"Tumis bawang putih dan bawang besar kisar sampai naik bau. Masukkan halia dan biji sawi.\",\"Masukkan cili kisar dan tumis sampai pecah minyak. Jangan gopoh; kalau cepat melekat, kecilkan api.\",\"Masukkan sos cili dan cuka. Kacau, kemudian masukkan ayam goreng.\",\"Masukkan telur rebus dan satu mangkuk kecil air. Perasakan dengan garam, gula dan serbuk perasa.\",\"Akhir sekali masukkan lobak merah, bawang tambahan dan cili padi. Reneh sekejap sampai sayur empuk ikut tahap yang anda suka.\"],\"source\":\"Kuali - Acar Ayam dan Telur, 21 Mei 2026\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null},{\"id\":187,\"title\":\"Terung Balado Ikan Bilis\",\"ingredients\":[\"2 biji terung\",\"1 cawan ikan bilis\",\"10 cili merah\",\"3 biji bawang merah\",\"3 ulas bawang putih\",\"1 biji tomato\",\"1 sudu besar gula\"],\"steps\":[\"Goreng terung dan ikan bilis.\",\"Kisar cili, bawang dan tomato, tumis.\",\"Masukkan gula.\",\"Gaul dengan terung.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":188,\"title\":\"Ayam Masak Bawang\",\"ingredients\":[\"1/2 ekor ayam\",\"2 bawang besar, hiris dan goreng\",\"3 rempah sekawan\",\"1 helai daun pandan\",\"3 sudu besar serbuk kari\",\"1 sudu besar serbuk cili\",\"1/2 sudu besar serbuk jintan manis\",\"sedikit air\",\"1 sudu besar sos tiram\",\"2 sudu besar sos cili\",\"2 sudu besar sos tomato\",\"garam\",\"Bahan kisar: 2 bawang besar, 5 ulas bawang putih, 1/2 inci halia\"],\"steps\":[\"Kisar bawang besar, bawang putih dan halia sampai halus.\",\"Gaul ayam dengan sedikit kunyit dan garam. Perap 30 minit.\",\"Goreng bawang hiris sampai perang dan wangi. Angkat. Goreng ayam dalam kuali yang sama sampai masak dan keemasan, kemudian angkat.\",\"Kurangkan minyak. Tumis rempah sekawan, pandan dan bahan kisar sampai wangi dan keemasan.\",\"Masukkan serbuk kari, cili dan jintan manis dengan sedikit air. Kacau sampai rempah masak dan minyak mula keluar.\",\"Masukkan sos tiram, sos cili, sos tomato dan garam. Kacau, kemudian masukkan ayam. Gaul sampai kuah menyalut ayam dan akhir sekali tabur bawang goreng.\"],\"source\":\"Kuali - Ayam Masak Bawang, 8 Oktober 2025\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null},{\"id\":189,\"title\":\"Ayam Masak Kicap Pekat\",\"ingredients\":[\"Bahan kisar: 2 bawang besar\",\"5 ulas bawang putih\",\"5 cili padi\",\"2 inci halia\",\"2 tangkai daun kari\",\"2 batang serai, ketuk\",\"kicap pekat secukupnya\",\"kicap lemak manis secukupnya\",\"sos tiram secukupnya\",\"serbuk perasa jika perlu\",\"ayam yang telah digoreng\"],\"steps\":[\"Kisar bawang besar, bawang putih, cili padi dan halia.\",\"Panaskan sedikit minyak. Tumis bahan kisar bersama daun kari dan serai sampai layu dan wangi.\",\"Masukkan kicap pekat, kicap lemak manis dan sos tiram sedikit demi sedikit. Kacau dan tengok warna serta rasa sebelum tambah lagi.\",\"Teruskan masak sampai kuah jadi pekat, gelap dan mula melekat elok pada sudip.\",\"Masukkan ayam goreng. Gaul sampai setiap bahagian ayam bersalut kuah kicap. Rasa dahulu sebelum tambah garam kerana kicap dan sos tiram sudah masin.\"],\"source\":\"Kuali - Ayam Masak Kicap Pekat, 12 September 2026\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null},{\"id\":190,\"title\":\"Asam Rebus Keladi\",\"ingredients\":[\"3 biji keladi\",\"3 cili api\",\"3 biji bawang merah\",\"4 keping asam keping\",\"1 sudu teh belacan\",\"garam\"],\"steps\":[\"Kupas, potong keladi.\",\"Kisar cili, bawang dan belacan.\",\"Rebus bersama asam.\",\"Masukkan keladi, reneh 15 minit.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":191,\"title\":\"Daging Goreng Berlengas Kelantan\",\"ingredients\":[\"600 g daging\",\"10 cili\",\"5 biji bawang\",\"kelapa\"],\"steps\":[\"Kisar rempah.\",\"Goreng daging.\ \"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":209,\"title\":\"Ikan Patin Tempoyak\",\"ingredients\":[\"500 g ikan patin\",\"tempoyak\",\"cili\",\"kunyit\"],\"steps\":[\"Kisar.\",\"Masak.\",\"Masukkan ikan.\",\"Reneh.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":210,\"title\":\"Cencaru Bakar Sambal Tempoyak\",\"ingredients\":[\"2 ekor ikan cencaru\",\"sambal tempoyak\",\"limau\"],\"steps\":[\"Perap ikan.\",\"Bakar.\",\"Gaul sambal.\",\"Hidang.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":211,\"title\":\"Asam Pedas Kepala Ikan Mayong\",\"ingredients\":[\"1 kepala ikan\",\"asam keping\",\"cili\",\"serai\"],\"steps\":[\"Kisar rempah.\",\"Rebus.\",\"Masukkan kepala.\",\"Reneh.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":212,\"title\":\"Lokan Masak Lemak Berempah\",\"ingredients\":[\"500 g lokan\",\"santan\",\"cili\",\"kunyit\"],\"steps\":[\"Bersihkan.\",\"Rebus.\",\"Masukkan santan.\",\"Masak.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":213,\"title\":\"Udang Galah Masak Lemak Cili Api\",\"ingredients\":[\"4 ekor udang galah\",\"2 cawan santan\",\"10 cili api\",\"3 biji bawang merah\",\"2 cm kunyit\",\"garam\"],\"steps\":[\"Kisar rempah.\",\"Rebus.\",\"Masukkan udang.\",\"Masukkan santan.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":214,\"title\":\"Daging Gulai Kawah Kelantan\",\"ingredients\":[\"1 kg daging\",\"santan\",\"rempah gulai\",\"kerisik\"],\"steps\":[\"Tumis rempah.\",\"Masukkan daging.\",\"Tuang santan.\",\"Reneh.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true,\"draft_level\":\"outline\"},{\"id\":215,\"title\":\"Umbut Kelapa Masak Lemak Putih\",\"ingredients\":[\"300 g umbut kelapa\",\"1 cawan santan putih\",\"3 biji bawang merah\",\"2 ulas bawang putih\",\"garam\"],\"steps\":[\"Hiris umbut.\",\"Rebus bawang.\",\"Masukkan umbut.\",\"Tuang santan.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":216,\"title\":\"Gulai Lemak Telur Itik\",\"ingredients\":[\"6 biji telur itik\",\"2 cawan santan\",\"8 cili api\",\"3 biji bawang\",\"2 cm kunyit\",\"garam\"],\"steps\":[\"Rebus telur, kupas.\",\"Kisar rempah, rebus dengan santan.\",\"Masukkan telur.\",\"Reneh 10 minit.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":217,\"title\":\"Rendang Maman Ayam Kampung\",\"ingredients\":[\"1 ekor ayam kampung\",\"3 cawan santan\",\"1 cawan daun maman\",\"5 cili api\",\"4 biji bawang\",\"1 sudu besar kerisik\"],\"steps\":[\"Kisar rempah.\",\"Masak ayam.\",\"Masukkan santan.\",\"Masukkan maman dan kerisik.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":218,\"title\":\"Pindang Ikan dan Timun\",\"ingredients\":[\"3 ekor ikan\",\"2 biji timun\",\"5 cili api\",\"3 biji bawang merah\",\"2 keping asam keping\",\"garam\"],\"steps\":[\"Kisar cili dan bawang.\",\"Rebus dengan asam.\",\"Masukkan ikan.\",\"Tambah timun.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true},{\"id\":219,\"title\":\"Ikan Keli Goreng Berempah\",\"ingredients\":[\"4 ekor ikan keli\",\"2 sudu besar kunyit\",\"1 sudu besar serbuk ketumbar\",\"1 sudu teh garam\",\"minyak\"],\"steps\":[\"Perap ikan dengan rempah.\",\"Biarkan 30 minit.\",\"Goreng.\",\"Tos.\"],\"source\":\"Dilengkapkan oleh Claude daripada kaedah standard (buku hanya beri senarai asas) - sila semak\",\"complete\":true,\"generic_placeholder\":false,\"nutrition\":null,\"drafted\":true}]");
function recipeCard(){const real=RD.filter(r=>r.complete);return `<section class="panel"><h3>Recipes from the Ensiklopedia</h3><p class="muted">${RD.length?RD.length+' dishes, '+real.length+' with ingredients and steps.':'Recipe data loads when served from the repo (data/recipes.json).'} Nutrition stays unknown until sourced values (e.g. MyFCD) are imported.</p><div class="search">${I('search',18)}<input id="rq" placeholder="Search recipes or ingredients" oninput="rsrch()"></div><div id="rr">${(RD.length?real.slice(0,40):REC.map(t=>({id:0,title:t,ingredients:[]}))).map(rr).join('')}</div></section>`}
const rr=r=>`<div class="item" ${r.id?`onclick="rview(${r.id})" style="cursor:pointer" tabindex="0"`:''}>${tile('book')}<div class="grow"><b>${r.title}</b><p class="meta">${r.web_sourced?'Web-sourced (MOH)':r.drafted?'Drafted recipe, please verify':r.complete?'Full quantities':'Base ingredients only'}</p><p class="facts"><span>${r.nutrition?'Nutrition: sourced (MOH)':'Nutrition: not available'}</span></p></div>${I('chev',18)}</div>`;
function rsrch(){const q=$('#rq').value.toLowerCase();$('#rr').innerHTML=(q?RD.filter(r=>r.title.toLowerCase().includes(q)||r.ingredients.some(i=>i.toLowerCase().includes(q))):RD.filter(r=>r.complete)).slice(0,30).map(rr).join('')||'<p class="mut">No match.</p>'}
function rview(id){const r=RD.find(x=>x.id==id);if(!r)return;sheet(`<h2 class="d">${r.title}</h2><p class="mut"><span class="tag">${r.web_sourced?'Sourced: Kementerian Kesihatan Malaysia, Resipi Sihat':r.drafted?'Drafted by Claude from the standard method — please verify':r.complete?'Full recipe':'Base list — book marks this page for a specific recipe'}</span></p><h3 style="margin-top:12px">Bahan-bahan</h3><ul style="padding-left:18px">${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>${r.complete?`<h3 style="margin-top:12px">Cara penyediaan</h3><ol style="padding-left:18px">${r.steps.map(i=>`<li>${i}</li>`).join('')}</ol>`:''}<p class="mut" style="margin-top:10px">Source: ${r.source||'—'}</p><p class="mut">${r.nutrition?`Per serving (MOH, ${r.nutrition.servings} servings): ${Object.entries(r.nutrition.per_serving).map(([k,v])=>k.replace('_',' ')+' '+v).join(', ')}`:'Nutrition: not available.'} Spoon/cup measures aren’t converted to grams without a verified source.</p>`)}
function weekly(){const d=Object.entries(S.hist).filter(([,v])=>v.n>0).slice(-7);if(d.length<3)return`<p class="mut">Not enough logged days yet (${d.length}/3). Missing days are never counted as poor days.</p>`;const a=k=>Math.round(d.reduce((s,[,v])=>s+v[k],0)/d.length);return`<p><b>${d.length} logged days.</b> Average protein ${a('p')} g, fibre ${a('f')} g.</p><p class="mut">One realistic focus: add one simple fibre snack on your lowest-fibre day.</p>`}
function hl(){const g=T(),pct=Math.min(S.water/(g.w*1000)*100,100),sub=S.sub.hl||'water';let b='';const wl=(S.water/1000).toFixed(2);
if(sub=='water')b=`<section class="panel center"><h3>Hydration</h3><div class="glass" role="img" aria-label="${wl} litres of ${g.w}"><div class="f" ${gr('gl','height',pct+'%')}></div></div><p class="serif big"><span data-k="wl" data-to="${wl}" data-d="2">${wl}</span> <small>of ${g.w} L</small></p><div class="row cen"><button class="btn" onclick="addW()">${I('plus',18)} Add 250 ml</button><button class="btn s" onclick="S.water=Math.max(0,S.water-250);save();go('hl')">Undo</button></div></section>`;
else if(sub=='mind')b=`<section class="panel"><h3>Quick check-in <span class="muted">(optional)</span></h3>${['Energy','Mood'].map((l,i)=>`<p class="lab">${l}</p><div class="scale">${[1,2,3,4,5].map(n=>`<button class="sq ${S.ci&&S.ci[i]==n?'on':''}" onclick="ci(${i},${n})" aria-label="${l} ${n} of 5">${n}</button>`).join('')}</div><div class="row sp muted"><span>Low</span><span>High</span></div>`).join('')}<p class="muted" style="margin-top:12px">${S.ci&&S.ci[0]&&S.ci[0]<=2?'Low energy noted. Want easier meal options?':'Skip anything you like. Core features never need this.'}</p>${S.ci&&S.ci[0]&&S.ci[0]<=2?'<button class="btn" style="margin-top:10px" onclick="S.lo=true;save();go(\'today\')">Turn on low-energy mode</button>':''}</section>
<section class="panel center"><h3>Reset breathing</h3><div class="orb" role="img" aria-label="Breathing guide"></div><p id="bt" aria-live="polite">Breathe in</p><p class="muted">Four seconds in, four seconds out. The text guide works without animation.</p></section>`;
else b=`<section class="panel"><h3>Activity and sleep</h3><p class="muted">Health integrations aren’t connected. No data is faked here; connect a provider later.</p></section>`;
return head()+seg('hl',[['water','Water','drop'],['mind','Mind','wind'],['act','Activity','flame']])+b}
function ci(i,n){S.ci=S.ci||[0,0];S.ci[i]=n;save();go('hl')}
function addW(){S.water+=250;save();go(S.tab)}
function chatInit(){const l=$('#cl');if(!S.chat.length)S.chat=[['a','Hi! Ask me what to eat, why fibre is low, or when to eat next. I explain; I never invent nutrient numbers.']];draw()}
function draw(){const l=$('#cl');if(l){l.innerHTML=S.chat.map(([w,t])=>`<div class="msg ${w}">${t}</div>`).join('');l.scrollTop=1e5}}
function coach(){return head()+`<section class="panel chat"><h3>Ask the coach</h3><p class="muted">It explains your day from your logged data. It never invents nutrient numbers.</p><div id="cl"></div><div class="row sugg">${['What should I eat?','Why is my fibre low?','When should I eat next?'].map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}</div><div class="compose"><input id="ci" placeholder="Ask about your day" onkeydown="event.key=='Enter'&&ask()"><button class="add" aria-label="Send" onclick="ask()">${I('send',18)}</button></div></section>`}
function ask(q){q=q||$('#ci').value;if(!q)return;const t=tot(),g=T(),s=q.toLowerCase(),o=sug()[0];let a;
if(/diagnos|medic|depress|adhd|disease/.test(s))a='That’s outside what I can safely help with. Please talk to a qualified health professional.';
else if(/fibre|fiber/.test(s))a=`You’re at ${t.f} of ${g.f} g fibre. ${t.n?'Greens, ulam, fruit or beans would help most.':'Nothing is logged yet, so it only looks low.'}`;
else if(/protein/.test(s))a=`Protein: ${t.p} of ${g.p} g so far.`;
else if(/when|next/.test(s))a=`${win()[0]}: ${win()[1]}. It’s a flexible window, not a rule.`;
else if(/eat|meal|cook|rm/.test(s))a=o?`Try ${o.x[0]}. ${o.r.map(r=>RS[r]).join('; ')}. Values are demo estimates.`:'No safe match with your filters.';
else if(/water|drink/.test(s))a=`Water: ${(S.water/1000).toFixed(2)} of ${g.w} L.`;
else a='I can help with what to eat, fibre, protein, water, or meal timing.';
S.chat.push(['u',q.replace(/</g,'&lt;')]);if($('#ci'))$('#ci').value='';draw();const cl=$('#cl');if(cl)cl.insertAdjacentHTML('beforeend','<div class="msg a typing"><i></i><i></i><i></i></div>');setTimeout(()=>{S.chat.push(['a',a]);save();draw()},650)}
function sheet(h){$('#sh').innerHTML=`<div class="sheet" onclick="if(event.target==this)closeS()"><div role="dialog">${h}</div></div>`}
const closeS=()=>$('#sh').innerHTML='';
function profile(){const p=S.p,g=T();sheet(`<h2 class="d">Your profile</h2><label>Name</label><input id="pn" value="${p.name}"><div class="row"><div style="flex:1"><label>Age</label><input id="pa" type="number" value="${p.age}"></div><div style="flex:1"><label>Height (cm)</label><input id="ph" type="number" value="${p.h}"></div><div style="flex:1"><label>Weight (kg)</label><input id="pw" type="number" value="${p.w}"></div></div>
<label>Allergies (hard filters)</label><div class="row">${AL.map(a=>`<span class="chip ${S.al.includes(a)?'on':''}" onclick="S.al.includes('${a}')?S.al=S.al.filter(x=>x!='${a}'):S.al.push('${a}');this.classList.toggle('on')">${a}</span>`).join('')}</div>
<label>Preferences</label><div class="row">${[['hk','Hide calories'],['fm','Focus-Friendly'],['lo','Low-energy'],['rm','Reduce motion']].map(([k,l])=>`<span class="chip ${S[k]?'on':''}" onclick="S.${k}=!S.${k};this.classList.toggle('on')">${l}</span>`).join('')}<span class="chip" onclick="S.th=S.th=='d'?'':'d';document.documentElement.dataset.t=S.th">Switch theme</span></div>
<p class="mut" style="margin-top:10px">Demo targets: ${g.p} g protein · ${g.f} g fibre · ${g.w} L water. Not clinical advice.</p>
<div class="row" style="margin-top:14px"><button class="btn" onclick="savep()">Save</button><button class="btn s" onclick="exp()">Export data</button><button class="btn s" style="color:#FF9C8F" onclick="if(confirm('Delete all data?')){localStorage.removeItem(K);location.reload()}">Delete all</button></div>`)}
function savep(){S.p={name:$('#pn').value.trim(),age:+$('#pa').value||30,h:+$('#ph').value||165,w:Math.max(30,+$('#pw').value||60)};document.body.classList.toggle('rm',S.rm);save();closeS();go(S.tab)}
function exp(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S));a.download='equilibra.json';a.click()}
let sc={};
function openScan(){sheet(`<h2 class="d">Log a meal</h2><p class="mut" style="margin:4px 0 12px">Photo is the fastest way. You always confirm before anything is logged.</p><label class="btn" style="display:block;text-align:center;margin-bottom:10px">${I('cam',18)} Take or choose a photo<input type="file" accept="image/*" capture="environment" hidden onchange="analyse(this.files[0])"></label><div class="row"><button class="btn s" onclick="closeS();S.sub.nut='log';go('nut');setTimeout(()=>$('#q').focus(),50)">Search manually</button><button class="btn s" onclick="rep()">Repeat last meal</button></div>`)}
function rep(){const m=S.meals[S.meals.length-1];if(!m){toast('No recent meal yet');return}closeS();log(F.find(f=>f[0]==m.n)||[m.n,m.e,m.k,m.p,m.f,1,[],0])}
function analyse(f){if(!f)return;const u=URL.createObjectURL(f);sc={u,sel:0,mul:1};sheet(`<h2 class="d">Analysing…</h2><div class="scanbox"><img src="${u}" alt="Your meal"><div class="beam"></div><div class="br"></div></div><p class="mut" style="margin-top:10px" id="st">Preparing image…</p>`);
const st=['Preparing image…','Looking for dishes…','Matching food records…'];st.forEach((s,i)=>setTimeout(()=>$('#st')&&($('#st').textContent=s),i*650));
const seed=f.size%F.length,ok=F.filter(x=>!x[6].some(a=>S.al.includes(a)||0));sc.c=[0,3,7].map((o,i)=>({x:F[(seed+o)%F.length],cf:[.62,.21,.09][i]}));setTimeout(review,2000)}
function review(){const c=sc.c;sheet(`<h2 class="d">Is this your meal?</h2><div class="scanbox"><img src="${sc.u}" alt="Your meal"></div><p class="mut" style="margin:8px 0"><span class="tag">MOCK recognizer (dev)</span> Not a trained model. Please check.</p>${c.map((o,i)=>`<button class="cand pop ${sc.sel==i?'on':''}" style="animation-delay:${i*.12}s" onclick="sc.sel=${i};review()">${tile(o.x[1])}${o.x[0]}<span class="cf">${o.cf>.5?'Likely':'Possible'}, ${Math.round(o.cf*100)}%<i class="cb" style="--w:${Math.round(o.cf*100)}%"></i></span></button>`).join('')}<button class="cand" onclick="closeS();go('nut')">None of these — search instead</button>
<label>Portion (estimate)</label><div class="row">${[['Small',.75],['Medium',1],['Large',1.3]].map(([l,v])=>`<span class="chip ${sc.mul==v?'on':''}" onclick="sc.mul=${v};review()">${l}</span>`).join('')}</div>
<p style="margin:12px 0"><b>${Math.round(c[sc.sel].x[3]*sc.mul)} g protein</b> · ${Math.round(c[sc.sel].x[4]*sc.mul)} g fibre${S.hk?'':' · '+Math.round(c[sc.sel].x[2]*sc.mul)+' kcal'} <span class="tag">estimated · demo</span></p>${c[sc.sel].x[6].some(a=>S.al.includes(a))?`<p style="color:#FF9C8F">${I('alert',16)} Contains an allergen you listed.</p>`:''}<button class="btn" onclick="closeS();log(sc.c[sc.sel].x,sc.mul,'photo')">Log this meal</button>`)}
document.documentElement.dataset.t=S.th;document.body.classList.toggle('rm',S.rm);
go('today');if(!S.p.name)setTimeout(profile,500);
</script></body></html>
