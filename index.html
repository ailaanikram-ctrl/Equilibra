return head()+seg('hl',[['water','Water','drop'],['mind','Mind','lotus'],['act','Activity','pulse']])+b}
function ci(i,n){S.ci=S.ci||[0,0];S.ci[i]=n;save();go('hl')}
function addW(){S.water+=250;window._rip=1;save();go(S.tab)}
function chatInit(){const l=$('#cl');if(!S.chat.length)S.chat=[['a','Hi! Ask me what to eat, why fibre is low, or when to eat next. I explain; I never invent nutrient numbers.']];draw()}
function draw(){const l=$('#cl');if(l){l.innerHTML=S.chat.map(([w,t])=>`<div class="msg ${w}">${t}</div>`).join('');l.scrollTop=1e5}}
function coach(){return head()+`<section class="panel chat"><h3>Ask the coach</h3><p class="muted">It explains your day from your logged data. It never invents nutrient numbers.</p><div id="cl"></div><div class="row sugg">${['What should I eat?','Why is my fibre low?','When should I eat next?'].map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}</div><div class="compose"><input id="ci" placeholder="Ask about your day" onkeydown="event.key=='Enter'&&ask()"><button class="add" aria-label="Send" onclick="ask()">${I('send',18)}</button></div></section>`}
function ask(q){q=q||$('#ci').value;if(!q)return;const t=tot(),g=T(),s=q.toLowerCase(),o=sug()[0];let a;
if(/diagnos|medic|depress|adhd|disease/.test(s))a='That’s outside what I can safely help with. Please talk to a qualified health professional.';
else if(/fibre|fiber/.test(s))a=`You’re at ${t.f} of ${g.f} g fibre. ${t.n?'Greens, ulam, fruit or beans would help most.':'Nothing is logged yet, so it only looks low.'}`;
else if(/protein/.test(s))a=`Protein: ${t.p} of ${g.p} g so far.`;
else if(/when|next/.test(s))a=`${win()[0]}: ${win()[1]}. It’s a flexible window, not a rule.`;
else if(/eat|meal|cook|rm/.test(s))a=o?`Try ${o.x[0]}. ${o.r.map(r=>RS[r]).join('; ')}. Values are demo estimates.`:'No safe match with your filters.';
else if(/water|drink/.test(s))a=`Water: ${(S.water/1000).toFixed(2)} of ${g.w} L.`;
else a='I can help with what to eat, fibre, protein, water, or meal timing.';
S.chat.push(['u',q.replace(/</g,'&lt;')]);if($('#ci'))$('#ci').value='';draw();const cl=$('#cl');if(cl)cl.insertAdjacentHTML('beforeend','<div class="msg a typing"><i></i><i></i><i></i></div>');setTimeout(()=>{S.chat.push(['a',a]);save();draw()},650)}
function sheet(h){$('#sh').innerHTML=`<div class="sheet" onclick="if(event.target==this)closeS()"><div role="dialog" aria-modal="true"><i class="grab"></i>${h}</div></div>`;document.body.classList.add('lock')}
function closeS(){const e=document.querySelector('.sheet');document.body.classList.remove('lock');if(!e)return;const d=e.firstElementChild;if(d)d.style.transform='';e.classList.add('out');setTimeout(()=>{if(e.isConnected&&e.classList.contains('out'))e.remove()},260)}
function pk(el,k,v){el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');S[k]=v;save();go(S.tab)}
function togAl(v,el){const i=S.al.indexOf(v);i<0?S.al.push(v):S.al.splice(i,1);el.classList.toggle('on');save();go(S.tab)}
function addAx(){const e=$('#ax'),v=(e.value||'').trim();if(!v)return;if(!S.alx.some(c=>lc(c)==lc(v)))S.alx.push(v);save();reP()}
function rmAx(i){S.alx.splice(i,1);save();reP()}
function reP(){const c=document.querySelector('.sheet>div'),y=c?c.scrollTop:0;profile();const n=document.querySelector('.sheet>div');if(n)n.scrollTop=y;go(S.tab)}
function tg(k,v){S[k]=v;if(k=='rm')document.body.classList.toggle('rm',v);save();go(S.tab)}
function tgTheme(v){S.th=v?'d':'';document.documentElement.dataset.t=S.th;save()}
function profile(){const p=S.p,g=T(),sw=(k,ic,l)=>`<label class="sw"><span>${I(ic,19)} ${l}</span><input type="checkbox" ${S[k]?'checked':''} onchange="tg('${k}',this.checked)"><i></i></label>`;
sheet(`<div class="ph"><span class="phav">${p.name?esx(p.name)[0].toUpperCase():I('user',26)}</span><div><h2>Your profile</h2><p class="muted">Everything stays on this device.</p></div></div>
<h3 class="pg">${I('user',18)} About you</h3><label>Name</label><input value="${esx(p.name)}" oninput="S.p.name=this.value.trim();save()" autocomplete="off">
<div class="row3"><div><label>Age</label><input type="number" inputmode="numeric" value="${p.age}" oninput="S.p.age=+this.value||30;save()"></div><div><label>Height (cm)</label><input type="number" inputmode="numeric" value="${p.h}" oninput="S.p.h=+this.value||165;save()"></div><div><label>Weight (kg)</label><input type="number" inputmode="decimal" value="${p.w}" onchange="S.p.w=Math.max(30,+this.value||60);save();go(S.tab)"></div></div>
<label>Goal</label><div class="row">${GOALS.map(([v,l])=>`<span class="chip ${S.goal==v?'on':''}" onclick="pk(this,'goal','${v}')">${l}</span>`).join('')}</div>
<label>Eating style</label><div class="row">${DIETS.map(([v,l])=>`<span class="chip ${S.diet==v?'on':''}" onclick="pk(this,'diet','${v}')">${l}</span>`).join('')}</div>
<h3 class="pg">${I('shield',18)} Allergies</h3><p class="muted">Foods with these are filtered out or clearly flagged.</p><div class="row" style="margin-top:8px">${ALG.map(([v,l,ic])=>`<span class="chip ${S.al.includes(v)?'on':''}" onclick="togAl('${v}',this)">${I(ic,16)}&nbsp;${l}</span>`).join('')}${S.alx.map((c,i)=>`<span class="chip on">${I('tag',16)}&nbsp;${esx(c)}<button class="cx" onclick="rmAx(${i})" aria-label="Remove ${esx(c)}">${I('x',14)}</button></span>`).join('')}</div>
<div class="row addx"><input id="ax" placeholder="Other allergy, type and add" onkeydown="event.key=='Enter'&&addAx()"><button class="btn sm" onclick="addAx()">${I('plus',16)} Add</button></div>
<h3 class="pg">${I('sliders',18)} Preferences</h3>${sw('hk','flame','Hide calories')}${sw('fm','bolt','Focus-Friendly mode')}${sw('lo','leaf','Low-energy mode')}${sw('rm','wind','Reduce motion')}<label class="sw"><span>${I('moon',19)} Dark theme</span><input type="checkbox" ${S.th=='d'?'checked':''} onchange="tgTheme(this.checked)"><i></i></label>
<label>Preview time of day</label><div class="row">${PVS.map(([v,l])=>`<span class="chip ${(S.pv??null)===v?'on':''}" onclick="pk(this,'pv',${JSON.stringify(v)})">${l}</span>`).join('')}</div>
<p class="muted sm" style="margin-top:12px">Demo targets: ${g.p} g protein, ${g.f} g fibre, ${g.w} L water, ${ACT_GOAL} min movement. Not clinical advice.</p>
<div class="row" style="margin-top:16px"><button class="btn" onclick="closeS();go(S.tab)">Done</button><button class="btn s" onclick="exp()">Export data</button><button class="btn s" style="color:var(--sambal)" onclick="if(confirm('Delete all data?')){localStorage.removeItem(K);location.reload()}">Delete all</button></div>`)}
function exp(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S));a.download='equilibra.json';a.click()}
let sc={};
function openScan(){sheet(`<h2 class="d">Log a meal</h2><p class="mut" style="margin:4px 0 12px">Photo is the fastest way. You always confirm before anything is logged.</p><label class="btn" style="display:block;text-align:center;margin-bottom:10px">${I('cam',18)} Take or choose a photo<input type="file" accept="image/*" capture="environment" hidden onchange="analyse(this.files[0])"></label><div class="row"><button class="btn s" onclick="closeS();S.sub.nut='log';go('nut');setTimeout(()=>$('#q').focus(),50)">Search manually</button><button class="btn s" onclick="rep()">Repeat last meal</button></div>`)}
function rep(){const m=S.meals[S.meals.length-1];if(!m){toast('No recent meal yet');return}closeS();log(F.find(f=>f[0]==m.n)||[m.n,m.e,m.k,m.p,m.f,1,[],0])}
function analyse(f){if(!f)return;const u=URL.createObjectURL(f);sc={u,sel:0,mul:1};sheet(`<h2 class="d">Analysing…</h2><div class="scanbox"><img src="${u}" alt="Your meal"><div class="beam"></div><div class="br"></div></div><p class="mut" style="margin-top:10px" id="st">Preparing image…</p>`);
const st=['Preparing image…','Looking for dishes…','Matching food records…'];st.forEach((s,i)=>setTimeout(()=>$('#st')&&($('#st').textContent=s),i*650));
const seed=f.size%F.length,ok=F.filter(x=>!x[6].some(a=>S.al.includes(a)||0));sc.c=[0,3,7].map((o,i)=>({x:F[(seed+o)%F.length],cf:[.62,.21,.09][i]}));setTimeout(review,2000)}
function review(){const c=sc.c;sheet(`<h2 class="d">Is this your meal?</h2><div class="scanbox"><img src="${sc.u}" alt="Your meal"></div><p class="mut" style="margin:8px 0"><span class="tag">MOCK recognizer (dev)</span> Development placeholder, not real recognition. Please check.</p>${c.map((o,i)=>`<button class="cand pop ${sc.sel==i?'on':''}" style="animation-delay:${i*.12}s" onclick="sc.sel=${i};review()">${tile(o.x[1])}${o.x[0]}<span class="cf">${o.cf>.5?'Likely':'Possible'}, ${Math.round(o.cf*100)}%<i class="cb" style="--w:${Math.round(o.cf*100)}%"></i></span></button>`).join('')}<button class="cand" onclick="closeS();go('nut')">None of these — search instead</button>
<label>Portion (estimate)</label><div class="row">${[['Small',.75],['Medium',1],['Large',1.3]].map(([l,v])=>`<span class="chip ${sc.mul==v?'on':''}" onclick="sc.mul=${v};review()">${l}</span>`).join('')}</div>
<p class="facts" style="margin:14px 0"><b>${Math.round(c[sc.sel].x[3]*sc.mul)} g protein</b> ${Math.round(c[sc.sel].x[4]*sc.mul)} g fibre${S.hk?'':' &nbsp; '+Math.round(c[sc.sel].x[2]*sc.mul)+' kcal'} <span class="tag">estimated · demo</span></p>${bad(c[sc.sel].x).length?`<p style="color:var(--sambal)">${I('alert',16)} Contains ${bad(c[sc.sel].x).join(', ')}, which you avoid.</p>`:''}<button class="btn" onclick="closeS();log(sc.c[sc.sel].x,sc.mul,'photo')">Log this meal</button>`)}
document.documentElement.dataset.t=S.th;document.body.classList.toggle('rm',S.rm);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
let _sk=0;addEventListener('scroll',()=>{if(_sk)return;_sk=requestAnimationFrame(()=>{_sk=0;const y=scrollY,m=$('#mh'),k=$('#sky');if(m)m.classList.toggle('on',y>(S.tab=='today'?210:110));if(k)k.style.setProperty('--sy',Math.min(y,320))})},{passive:true});
let _dg=null;document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.grab');if(!g)return;const d=g.parentElement;_dg={y:e.clientY,d,dy:0};d.style.transition='none';try{g.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!_dg)return;_dg.dy=Math.max(0,e.clientY-_dg.y);_dg.d.style.transform=`translateY(${_dg.dy}px)`});
document.addEventListener('pointerup',()=>{if(!_dg)return;const{d,dy}=_dg;_dg=null;d.style.transition='transform .4s cubic-bezier(.16,1,.3,1)';if(dy>110)closeS();else d.style.transform=''});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.btn,.add,.ibtn,.sq,.chip');if(!t||t.closest('.dock')||t.closest('.tabs')||S.rm||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=t.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,k=document.createElement('span');k.className='rpl';k.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;t.appendChild(k);setTimeout(()=>k.remove(),700);if(navigator.vibrate&&t.matches('.btn,.add,.sq'))navigator.vibrate(8)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches&&e.target.matches('[role=button]'))e.target.click()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickSky();tickDash()}});
go('today');{const sp=$('#splash'),red=S.rm||matchMedia('(prefers-reduced-motion:reduce)').matches;setTimeout(()=>{if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),650)}if(!S.p.name)setTimeout(profile,350)},red?0:1300)}
</script></body></html>
