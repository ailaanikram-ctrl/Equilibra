<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Equilibra</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1F4D3A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6EE;--card:#fff;--ink:#22302A;--mut:#6B7A72;--g:#1F4D3A;--leaf:#5FB36A;--co:#FF8A65;--bl:#4DA3E0;--lv:#8E86D9;--am:#E8A33D;--bd:#E9E2D3;--sh:0 6px 22px rgba(31,77,58,.09);--r:22px;--m:.5s cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root:not([data-t=l]){--bg:#101A16;--card:#18251F;--ink:#EDF3EE;--mut:#9DB0A5;--g:#7FD39A;--bd:#27382F;--sh:0 6px 22px rgba(0,0,0,.35)}}
:root[data-t=d]{--bg:#101A16;--card:#18251F;--ink:#EDF3EE;--mut:#9DB0A5;--g:#7FD39A;--bd:#27382F;--sh:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:16px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,.d{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em}
#app{max-width:480px;margin:auto;padding:16px 16px 120px}
.blob{position:fixed;inset:0;z-index:-1;overflow:hidden}.blob i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.28;animation:fl 18s ease-in-out infinite alternate}
.blob i:nth-child(1){width:260px;height:260px;background:var(--leaf);top:-60px;right:-60px}.blob i:nth-child(2){width:220px;height:220px;background:var(--co);bottom:80px;left:-80px;animation-delay:-6s}.blob i:nth-child(3){width:200px;height:200px;background:var(--lv);top:45%;right:-90px;animation-delay:-11s}
@keyframes fl{to{transform:translate(30px,40px) scale(1.15)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{font-size:26px;font-weight:800}.top small{color:var(--mut)}
.av{width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:#fff;font:700 18px 'Bricolage Grotesque';cursor:pointer}
.hero{background:linear-gradient(135deg,#1F4D3A,#2F7A55 60%,#5FB36A);color:#fff;border:0;position:relative;overflow:hidden}
.hero h2{font-size:22px;line-height:1.2;margin:6px 0 12px}.hero small{opacity:.85}
.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-40px;top:-40px;background:rgba(255,255,255,.12);animation:pu 5s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.25)}}
.btn{border:0;border-radius:999px;padding:11px 18px;font:600 15px Figtree;cursor:pointer;background:var(--g);color:#fff;min-height:44px;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.s{background:transparent;color:inherit;border:1.5px solid currentColor}.btn.w{background:#fff;color:#1F4D3A}.btn.c{background:var(--co);color:#2b1308}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.rings{display:flex;justify-content:space-around;gap:6px;text-align:center}
.ring{width:84px}.ring svg{width:84px;height:84px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--bd)}.ring .v{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{display:block;font:700 15px 'Bricolage Grotesque'}.ring span{font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.chip{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);font:500 14px Figtree;cursor:pointer;min-height:36px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
h3{font-size:18px;margin-bottom:8px}.mut{color:var(--mut);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0));pointer-events:none}
nav div{pointer-events:auto;width:100%;max-width:456px;display:flex;justify-content:space-around;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--sh);padding:8px 6px}
nav button{background:none;border:0;color:var(--mut);font:600 11px Figtree;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;min-width:56px;min-height:48px}
nav button .e{font-size:22px;transition:transform .3s}nav button.on{color:var(--g)}nav button.on .e{transform:translateY(-3px) scale(1.15)}
nav .scan{background:linear-gradient(135deg,var(--co),#FF6F61);color:#2b1308;border-radius:50%;width:64px;height:64px;min-width:64px;margin-top:-30px;box-shadow:0 8px 20px rgba(255,111,97,.5);justify-content:center;animation:bo 3s ease-in-out infinite}
@keyframes bo{50%{transform:translateY(-4px)}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fi .25s}
.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0));animation:su .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(60px);opacity:0}}
input,select{width:100%;padding:11px 13px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);font:16px Figtree;min-height:44px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.meal{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.meal:last-child{border:0}.meal .e{font-size:30px}
.pop{animation:po .5s cubic-bezier(.2,1.4,.4,1)}@keyframes po{from{transform:scale(.85);opacity:0}}
.scanbox{position:relative;border-radius:20px;overflow:hidden;background:#0d1a14;min-height:200px}.scanbox img{width:100%;display:block;max-height:280px;object-fit:cover}
.beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#8CF3A8,transparent);box-shadow:0 0 18px #8CF3A8;animation:sc 1.6s ease-in-out infinite alternate}
@keyframes sc{from{top:6%}to{top:92%}}
.br{position:absolute;inset:12px;border:2px solid rgba(255,255,255,.7);border-radius:14px;border-style:dashed}
.cand{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px;color:var(--ink);cursor:pointer;font:500 15px Figtree}.cand.on{border-color:var(--g);box-shadow:0 0 0 3px rgba(95,179,106,.25)}
.cand .cf{margin-left:auto;font-size:13px;color:var(--mut)}
.glass{width:90px;height:110px;border:3px solid var(--bl);border-radius:8px 8px 22px 22px;position:relative;overflow:hidden;margin:auto}
.glass .f{position:absolute;left:0;right:0;bottom:0;background:var(--bl);opacity:.75;transition:height 1s}.glass .f:before{content:"";position:absolute;left:-50%;top:-10px;width:200%;height:20px;background:radial-gradient(circle at 50% 100%,transparent 60%,var(--bl) 62%) 0 0/30px 20px;animation:wv 2s linear infinite}
@keyframes wv{to{transform:translateX(30px)}}
.orb{width:110px;height:110px;border-radius:50%;margin:14px auto;background:radial-gradient(circle,var(--lv),#5d57b8);animation:br 8s ease-in-out infinite}@keyframes br{50%{transform:scale(1.45)}}
.msg{padding:10px 14px;border-radius:18px;margin:6px 0;max-width:88%;animation:po .3s}.msg.u{background:var(--g);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.msg.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.big{font-size:19px;padding:16px;width:100%;margin-bottom:10px}
.tag{font-size:11px;background:var(--am);color:#2b1c05;padding:2px 8px;border-radius:99px;font-weight:600}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
body.rm *,body.rm *:before{animation:none!important;transition:none!important}
</style></head><body>
<div class="blob"><i></i><i></i><i></i></div>
<div id="app"></div><div id="nav"></div><div id="sh"></div>
<script>
const $=s=>document.querySelector(s),K='eq1';
const AL=['peanut','egg','shellfish','gluten','milk','fish'];
// DEMO placeholder values per serving - NOT sourced nutrition data. Replace with MyFCD records.
const F=[['Nasi lemak','🥥',600,16,4,1,['peanut','egg'],6],['Roti canai + dhal','🫓',420,11,4,1,['gluten'],3],['Nasi ayam','🍗',560,24,2,1,[],8],['Mee goreng mamak','🍜',640,20,5,1,['gluten','egg'],7],['Laksa Sarawak','🍲',520,22,3,1,['shellfish','gluten'],9],['Ikan bakar, ulam & nasi','🐟',480,34,7,2,['fish'],12],['Telur rebus, pisang & yogurt','🥚',330,20,3,1,['egg','milk'],5],['Gado-gado','🥗',450,18,9,2,['peanut'],8],['Ayam goreng kunyit, kerabu & nasi','🍛',520,30,6,2,[],12],['Hinava ikan & nasi (Sabah)','🍣',430,28,3,2,['fish'],10]];
const REC=['Rendang Daging Negeri Sembilan','Nasi Air Kelantan','Nasi Goreng Cili Kering','Lontong Kuah Lodeh','Ayam Goreng Kunyit','Kerabu Kacang Botol'];
const td=()=>new Date().toISOString().slice(0,10);
let S={p:{name:'',age:30,h:165,w:60},meals:[],water:0,day:td(),al:[],hk:false,fm:false,lo:false,rm:false,ci:null,hist:{},bud:0,tab:'today',chat:[],th:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(S.day!==td()){S.hist[S.day]=tot();S.meals=[];S.water=0;S.ci=null;S.day=td()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function tot(){return S.meals.reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,f:a.f+m.f,n:a.n+1}),{k:0,p:0,f:0,n:0})}
// DEMO targets - development formulas, not clinical advice
const T=()=>({k:Math.round(S.p.w*30/50)*50,p:Math.round(S.p.w*1.2),f:30,w:Math.round(S.p.w*33/100)/10});
const hr=()=>new Date().getHours();
let prev={};
function ring(id,v,t,col,lab,u){const c=2*Math.PI*37,o=c*(1-Math.min(v/t,1)),from=prev[id]??c;setTimeout(()=>{const e=document.getElementById('r'+id);if(e){e.style.strokeDashoffset=o}},60);prev[id]=o;
return`<div class="ring"><svg viewBox="0 0 84 84" role="img" aria-label="${lab}: ${Math.round(v)} of ${Math.round(t)} ${u}"><circle class="t" cx="42" cy="42" r="37"/><circle class="v" id="r${id}" cx="42" cy="42" r="37" stroke="${col}" stroke-dasharray="${c}" style="stroke-dashoffset:${from}"/></svg><b>${Math.round(Math.max(t-v,0))}${u}</b><span>${lab} left</span></div>`}
function nba(){const t=tot(),g=T(),h=hr();
if(S.lo)return['Keep it easy','You don’t need a perfect meal. A quick, balanced option is enough.','Low-energy mode is on.'];
if(S.water<g.w*1000*.35&&h>=11)return['Have some water','You’re a little behind your usual hydration pace today.','hydration_behind_plan'];
if(t.n===0&&h<11)return['Start with breakfast','A protein + fibre start makes later choices easier.','no_meal_logged'];
if(t.n===0||(h>=11&&h<15&&t.n<2))return['Lunch is coming up','Aim for protein and fibre. I have a few simple options ready.','usual_meal_window + protein_remaining'];
if(h>=21)return['Start winding down','Dinner is done? A calm evening helps tomorrow’s routine.','bedtime_approaching'];
if(t.p<g.p*.6&&h>=17)return['Protein is the gap','A protein-forward dinner would balance the day.','protein_remaining'];
return['You’re nicely balanced','No action needed right now.','balanced']}
function win(){const h=hr();return h<10?['Breakfast','7:30–9:00 AM']:h<15?['Lunch','12:30–1:30 PM']:h<18?['Tea-time snack','4:00–5:00 PM']:['Dinner','7:00–8:30 PM']}
function sug(){const t=tot(),g=T(),rp=Math.max(g.p-t.p,0),rf=Math.max(g.f-t.f,0);
return F.filter(x=>!x[6].some(a=>S.al.includes(a))&&(!S.lo||x[5]==1)&&(!S.bud||x[7]<=S.bud)).map(x=>({x,s:Math.min(x[3],rp)*1+Math.min(x[4],rf)*2-(x[2]>g.k*.4?10:0)})).sort((a,b)=>b.s-a.s).slice(0,3).map(o=>{const r=[];if(rp>20)r.push('protein_remaining');if(rf>8)r.push('fibre_remaining');if(S.al.length)r.push('allergy_filtered');if(S.lo)r.push('low_effort_selected');if(S.bud)r.push('user_budget_filter');return{...o,r}})}
const RS={protein_remaining:'Protein is still below today’s target',fibre_remaining:'Fibre still needs attention',allergy_filtered:'Your allergens are excluded',low_effort_selected:'Quick, low-effort pick',user_budget_filter:'Within your budget (user-set estimate)'};
const kc=v=>S.hk?'':` · ${v} kcal`;
function log(x,mul=1,via='manual'){S.meals.push({id:Date.now(),t:Date.now(),n:x[0],e:x[1],k:Math.round(x[2]*mul),p:Math.round(x[3]*mul),f:Math.round(x[4]*mul*10)/10,via});save();toast('Logged '+x[0]);go(S.tab)}
function toast(m){const d=document.createElement('div');d.className='pop';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1F4D3A;color:#fff;padding:10px 18px;border-radius:99px;z-index:30;box-shadow:var(--sh)';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),1800)}
function nav(){$('#nav').innerHTML=`<nav><div>${[['today','🏡','Today'],['nut','🥗','Nutrition'],['scan','📷','Scan'],['hl','💧','Health'],['coach','💬','Coach']].map(([k,e,l])=>`<button class="${k=='scan'?'scan':''} ${S.tab==k?'on':''}" onclick="${k=='scan'?'openScan()':`go('${k}')`}" aria-label="${l}"><span class="e">${e}</span>${k=='scan'?'':l}</button>`).join('')}</div></nav>`}
function head(){const n=S.p.name,g=hr()<12?'Selamat pagi':hr()<18?'Selamat petang':'Selamat malam';return`<div class="top"><div><small>${new Date().toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long'})}</small><h1>${g}${n?', '+n:''}</h1></div><button class="av" onclick="profile()" aria-label="Profile">${(n||'E')[0].toUpperCase()}</button></div>`}
function go(t){S.tab=t;save();const A=$('#app');A.innerHTML=({today,nut,hl,coach})[t]();nav();if(t=='coach')chatInit();window.scrollTo(0,0)}
function today(){const t=tot(),g=T(),[a,b,why]=nba(),w=win(),sg=sug();
const hero=`<div class="card hero pop"><small>Next best action</small><h2>${a}</h2><p style="opacity:.92">${b}</p><div class="row" style="margin-top:12px"><button class="btn w" onclick="openScan()">Scan a meal</button><button class="btn s" onclick="alert('Why you’re seeing this: ${why}')">Why?</button></div></div>`;
if(S.fm)return head()+`<div class="card pop"><small class="mut">ONE THING NOW</small><h2 class="d" style="font-size:30px;margin:6px 0 14px">${S.water<g.w*350?'Drink water':'Eat '+w[0].toLowerCase()}</h2>${sg.map((o,i)=>`<button class="btn big ${i?'s':''}" style="${i?'color:var(--ink)':''}" onclick="log(F.find(f=>f[0]=='${o.x[0]}'))">${o.x[1]} ${o.x[0]}</button>`).join('')}<div class="row"><button class="btn s" style="color:var(--ink)" onclick="addW()">+250 ml water</button><button class="btn s" style="color:var(--ink)" onclick="go('nut')">Choose another</button></div></div>`+hero;
return head()+hero+`<div class="card"><div class="row sp"><h3>Today’s nutrition</h3><span class="mut">${t.n} meal${t.n==1?'':'s'}</span></div><div class="rings">${S.hk?'':ring('k',t.k,g.k,'#FF8A65','Energy','')}${ring('p',t.p,g.p,'#1F8A4C','Protein','g')}${ring('f',t.f,g.f,'#5FB36A','Fibre','g')}${ring('w',S.water/1000,g.w,'#4DA3E0','Water','L')}</div><p class="mut" style="margin-top:10px">${t.n?'Remaining needs shown. Incomplete isn’t bad — the day isn’t over.':'Nothing logged yet. Scan or search your first meal.'}</p></div>
<div class="card"><h3>Next meal: ${w[0]}</h3><p>Suggested window <b>${w[1]}</b></p><p class="mut">Flexible, based on a typical routine you can adjust.</p><div class="row" style="margin-top:10px"><button class="btn" onclick="toast('Reminder set')">Remind me</button><button class="btn s" style="color:var(--ink)" onclick="toast('Okay, later')">Later</button></div></div>
<div class="card"><h3>What should I eat?</h3>${sugHTML(sg)}<div class="row" style="margin-top:6px">${[['Any',0],['≤ RM10',10],['≤ RM20',20]].map(([l,v])=>`<span class="chip ${S.bud==v?'on':''}" onclick="S.bud=${v};go('today')">${l}</span>`).join('')}<span class="chip ${S.lo?'on':''}" onclick="S.lo=!S.lo;go('today')">Low energy</span></div></div>`}
function sugHTML(sg){return sg.length?sg.map(o=>`<div class="meal"><span class="e">${o.x[1]}</span><div style="flex:1"><b>${o.x[0]}</b><div class="mut">${o.r.map(r=>RS[r]).join(' · ')||'Balanced pick'}</div><div class="mut">${o.x[2]?(S.hk?'':o.x[2]+' kcal · ')+o.x[3]+' g protein · '+o.x[4]+' g fibre · ~RM'+o.x[7]:''} <span class="tag">demo values</span></div></div><button class="btn" onclick="log(F.find(f=>f[0]=='${o.x[0]}'))">Log</button></div>`).join(''):'<p class="mut">No safe match with your filters. Loosen budget or effort, or search manually.</p>'}
function nut(){const t=tot(),g=T();
const bar=(l,v,tg,c,u)=>`<div class="row sp"><b>${l}</b><span class="mut">${Math.round(v)} / ${tg} ${u}</span></div><div class="bar"><i style="width:${Math.min(v/tg*100,100)}%;background:${c}"></i></div>`;
return head()+`<div class="card"><h3>Completion</h3>${S.hk?'':bar('Energy',t.k,g.k,'var(--co)','kcal')}${bar('Protein',t.p,g.p,'#1F8A4C','g')}${bar('Fibre',t.f,g.f,'var(--leaf)','g')}<p class="mut">Targets are <span class="tag">development demo</span> values from your profile — not clinical advice.</p></div>
<div class="card"><h3>Find &amp; log food</h3><input id="q" placeholder="Search nasi lemak, laksa, hinava…" oninput="srch()"><div id="res" style="margin-top:8px">${F.slice(0,4).map(fr).join('')}</div></div>
<div class="card"><h3>Today’s meals</h3>${S.meals.length?S.meals.slice().reverse().map(m=>`<div class="meal pop"><span class="e">${m.e}</span><div style="flex:1"><b>${m.n}</b><div class="mut">${new Date(m.t).toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit'})}${kc(m.k)} · ${m.p} g protein · estimated</div></div><button class="chip" aria-label="Delete" onclick="S.meals=S.meals.filter(x=>x.id!=${m.id});save();go('nut')">✕</button></div>`).join(''):'<p class="mut">No meals yet. An empty plate is an invitation, not a failure.</p>'}</div>
${recipeCard()}<div class="card"><h3>Weekly view</h3>${weekly()}</div>`}
const fr=x=>`<div class="meal"><span class="e">${x[1]}</span><div style="flex:1"><b>${x[0]}</b><div class="mut">${S.al.some(a=>x[6].includes(a))?'⚠ contains '+x[6].filter(a=>S.al.includes(a)).join(', '):x[3]+' g protein · demo value'}</div></div><button class="btn" onclick="log(F.find(f=>f[0]=='${x[0]}'))">Log</button></div>`;
function srch(){const q=$('#q').value.toLowerCase();$('#res').innerHTML=F.filter(x=>x[0].toLowerCase().includes(q)).map(fr).join('')||'<p class="mut">Not in the demo list. Custom foods come with the sourced database.</p>'}
let RD=[];fetch('data/recipes.json').then(r=>r.json()).then(j=>{RD=j.recipes;if(S.tab=='nut')go('nut')}).catch(()=>{});
function recipeCard(){const real=RD.filter(r=>r.complete);return`<div class="card"><h3>Recipes <span class="tag">Ensiklopedia Edisi 7</span></h3><p class="mut" style="margin-bottom:8px">${RD.length?RD.length+' dishes from the book: '+real.length+' with full quantities, the rest are base ingredient lists.':'Recipe data loads when served from the repo (data/recipes.json).'} Nutrition stays unknown until sourced values (e.g. MyFCD) are imported.</p><input id="rq" placeholder="Search recipes…" oninput="rsrch()"><div id="rr" style="margin-top:8px">${(RD.length?real:REC.map((t,i)=>({id:0,title:t,ingredients:[]}))).map(rr).join('')}</div></div>`}
const rr=r=>`<div class="meal" ${r.id?`onclick="rview(${r.id})" style="cursor:pointer"`:''}><span class="e">📖</span><div style="flex:1"><b>${r.title}</b><div class="mut">${r.drafted?'Drafted recipe — verify':r.complete?'Full quantities':'Base ingredients only'} · Nutrition: not available</div></div></div>`;
function rsrch(){const q=$('#rq').value.toLowerCase();$('#rr').innerHTML=(q?RD.filter(r=>r.title.toLowerCase().includes(q)||r.ingredients.some(i=>i.toLowerCase().includes(q))):RD.filter(r=>r.complete)).slice(0,30).map(rr).join('')||'<p class="mut">No match.</p>'}
function rview(id){const r=RD.find(x=>x.id==id);if(!r)return;sheet(`<h2 class="d">${r.title}</h2><p class="mut"><span class="tag">${r.drafted?'Drafted by Claude from the standard method — please verify':r.complete?'Full recipe':'Base list — book marks this page for a specific recipe'}</span></p><h3 style="margin-top:12px">Bahan-bahan</h3><ul style="padding-left:18px">${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>${r.complete?`<h3 style="margin-top:12px">Cara penyediaan</h3><ol style="padding-left:18px">${r.steps.map(i=>`<li>${i}</li>`).join('')}</ol>`:''}<p class="mut" style="margin-top:10px">Source: ${r.source||'—'}</p><p class="mut">Nutrition: not available. Spoon/cup measures aren’t converted to grams without a verified source.</p>`)}
function weekly(){const d=Object.entries(S.hist).filter(([,v])=>v.n>0).slice(-7);if(d.length<3)return`<p class="mut">Not enough logged days yet (${d.length}/3). Missing days are never counted as poor days.</p>`;const a=k=>Math.round(d.reduce((s,[,v])=>s+v[k],0)/d.length);return`<p><b>${d.length} logged days.</b> Average protein ${a('p')} g, fibre ${a('f')} g.</p><p class="mut">One realistic focus: add one simple fibre snack on your lowest-fibre day.</p>`}
function hl(){const g=T(),pct=Math.min(S.water/(g.w*1000)*100,100);
return head()+`<div class="card" style="text-align:center"><h3>Hydration</h3><div class="glass" role="img" aria-label="${(S.water/1000).toFixed(2)} litres of ${g.w}"><div class="f" style="height:${pct}%"></div></div><p style="margin:10px 0"><b>${(S.water/1000).toFixed(2)}</b> / ${g.w} L</p><div class="row" style="justify-content:center"><button class="btn" onclick="addW()">+250 ml</button><button class="btn s" style="color:var(--ink)" onclick="S.water=Math.max(0,S.water-250);save();go('hl')">Undo</button></div></div>
<div class="card"><h3>Quick check-in <span class="mut">(optional)</span></h3>${['Energy','Mood'].map((l,i)=>`<p class="mut" style="margin-top:6px">${l}</p><div class="row">${[1,2,3,4,5].map(n=>`<span class="chip ${S.ci&&S.ci[i]==n?'on':''}" onclick="ci(${i},${n})" aria-label="${l} ${n} of 5">${['😴','😕','😐','🙂','😄'][n-1]}</span>`).join('')}</div>`).join('')}<p class="mut" style="margin-top:8px">${S.ci&&S.ci[0]&&S.ci[0]<=2?'Low energy noted. Want easier meal options?':'Skip anything you like. Core features never need this.'}</p>${S.ci&&S.ci[0]<=2?'<button class="btn c" onclick="S.lo=true;save();go(\'today\')">Turn on low-energy mode</button>':''}</div>
<div class="card" style="text-align:center"><h3>Reset breathing</h3><div class="orb" role="img" aria-label="Breathing guide"></div><p class="mut">Breathe in as it grows (4 s), out as it shrinks (4 s). Text guide works without animation.</p></div>
<div class="card"><h3>Activity &amp; sleep</h3><p class="mut">Health integrations aren’t connected. No data is faked here — connect a provider later.</p></div>`}
function ci(i,n){S.ci=S.ci||[0,0];S.ci[i]=n;save();go('hl')}
function addW(){S.water+=250;save();go(S.tab)}
function chatInit(){const l=$('#cl');if(!S.chat.length)S.chat=[['a','Hi! Ask me what to eat, why fibre is low, or when to eat next. I explain; I never invent nutrient numbers.']];draw()}
function draw(){const l=$('#cl');if(l){l.innerHTML=S.chat.map(([w,t])=>`<div class="msg ${w}">${t}</div>`).join('');l.scrollTop=1e5}}
function coach(){return head()+`<div class="card"><h3>Coach</h3><div id="cl" style="max-height:48vh;overflow:auto"></div><div class="row" style="margin:8px 0">${['What should I eat?','Why is my fibre low?','When should I eat next?'].map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}</div><div class="row"><input id="ci" placeholder="Ask anything about today" style="flex:1" onkeydown="event.key=='Enter'&&ask()"><button class="btn" onclick="ask()">Send</button></div></div>`}
function ask(q){q=q||$('#ci').value;if(!q)return;const t=tot(),g=T(),s=q.toLowerCase(),o=sug()[0];let a;
if(/diagnos|medic|depress|adhd|disease/.test(s))a='That’s outside what I can safely help with. Please talk to a qualified health professional.';
else if(/fibre|fiber/.test(s))a=`You’re at ${t.f} of ${g.f} g fibre. ${t.n?'Greens, ulam, fruit or beans would help most.':'Nothing is logged yet, so it only looks low.'}`;
else if(/protein/.test(s))a=`Protein: ${t.p} of ${g.p} g so far.`;
else if(/when|next/.test(s))a=`${win()[0]}: ${win()[1]}. It’s a flexible window, not a rule.`;
else if(/eat|meal|cook|rm/.test(s))a=o?`Try ${o.x[0]}. ${o.r.map(r=>RS[r]).join('; ')}. Values are demo estimates.`:'No safe match with your filters.';
else if(/water|drink/.test(s))a=`Water: ${(S.water/1000).toFixed(2)} of ${g.w} L.`;
else a='I can help with what to eat, fibre, protein, water, or meal timing.';
S.chat.push(['u',q.replace(/</g,'&lt;')],['a',a]);save();if($('#ci'))$('#ci').value='';draw()}
function sheet(h){$('#sh').innerHTML=`<div class="sheet" onclick="if(event.target==this)closeS()"><div role="dialog">${h}</div></div>`}
const closeS=()=>$('#sh').innerHTML='';
function profile(){const p=S.p,g=T();sheet(`<h2 class="d">Your profile</h2><label>Name</label><input id="pn" value="${p.name}"><div class="row"><div style="flex:1"><label>Age</label><input id="pa" type="number" value="${p.age}"></div><div style="flex:1"><label>Height (cm)</label><input id="ph" type="number" value="${p.h}"></div><div style="flex:1"><label>Weight (kg)</label><input id="pw" type="number" value="${p.w}"></div></div>
<label>Allergies (hard filters)</label><div class="row">${AL.map(a=>`<span class="chip ${S.al.includes(a)?'on':''}" onclick="S.al.includes('${a}')?S.al=S.al.filter(x=>x!='${a}'):S.al.push('${a}');this.classList.toggle('on')">${a}</span>`).join('')}</div>
<label>Preferences</label><div class="row">${[['hk','Hide calories'],['fm','Focus-Friendly'],['lo','Low-energy'],['rm','Reduce motion']].map(([k,l])=>`<span class="chip ${S[k]?'on':''}" onclick="S.${k}=!S.${k};this.classList.toggle('on')">${l}</span>`).join('')}<span class="chip" onclick="S.th=S.th=='d'?'l':'d';document.documentElement.dataset.t=S.th">Toggle dark</span></div>
<p class="mut" style="margin-top:10px">Demo targets: ${g.p} g protein · ${g.f} g fibre · ${g.w} L water. Not clinical advice.</p>
<div class="row" style="margin-top:14px"><button class="btn" onclick="savep()">Save</button><button class="btn s" style="color:var(--ink)" onclick="exp()">Export data</button><button class="btn s" style="color:#c0392b" onclick="if(confirm('Delete all data?')){localStorage.removeItem(K);location.reload()}">Delete all</button></div>`)}
function savep(){S.p={name:$('#pn').value.trim(),age:+$('#pa').value||30,h:+$('#ph').value||165,w:Math.max(30,+$('#pw').value||60)};document.body.classList.toggle('rm',S.rm);save();closeS();go(S.tab)}
function exp(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S));a.download='equilibra.json';a.click()}
let sc={};
function openScan(){sheet(`<h2 class="d">Log a meal</h2><p class="mut" style="margin:4px 0 12px">Photo is the fastest way. You always confirm before anything is logged.</p><label class="btn" style="display:block;text-align:center;margin-bottom:10px">📷 Take or choose a photo<input type="file" accept="image/*" capture="environment" hidden onchange="analyse(this.files[0])"></label><div class="row"><button class="btn s" style="color:var(--ink)" onclick="closeS();go('nut');setTimeout(()=>$('#q').focus(),50)">Search manually</button><button class="btn s" style="color:var(--ink)" onclick="rep()">Repeat last meal</button></div>`)}
function rep(){const m=S.meals[S.meals.length-1];if(!m){toast('No recent meal yet');return}closeS();log(F.find(f=>f[0]==m.n)||[m.n,m.e,m.k,m.p,m.f,1,[],0])}
function analyse(f){if(!f)return;const u=URL.createObjectURL(f);sc={u,sel:0,mul:1};sheet(`<h2 class="d">Analysing…</h2><div class="scanbox"><img src="${u}" alt="Your meal"><div class="beam"></div><div class="br"></div></div><p class="mut" style="margin-top:10px" id="st">Preparing image…</p>`);
const st=['Preparing image…','Looking for dishes…','Matching food records…'];st.forEach((s,i)=>setTimeout(()=>$('#st')&&($('#st').textContent=s),i*650));
const seed=f.size%F.length,ok=F.filter(x=>!x[6].some(a=>S.al.includes(a)||0));sc.c=[0,3,7].map((o,i)=>({x:F[(seed+o)%F.length],cf:[.62,.21,.09][i]}));setTimeout(review,2000)}
function review(){const c=sc.c;sheet(`<h2 class="d">Is this your meal?</h2><div class="scanbox"><img src="${sc.u}" alt="Your meal"></div><p class="mut" style="margin:8px 0"><span class="tag">MOCK recognizer (dev)</span> Not a trained model. Please check.</p>${c.map((o,i)=>`<button class="cand pop ${sc.sel==i?'on':''}" style="animation-delay:${i*.12}s" onclick="sc.sel=${i};review()"><span style="font-size:26px">${o.x[1]}</span>${o.x[0]}<span class="cf">${o.cf>.5?'Likely':'Possible'} · ${Math.round(o.cf*100)}%</span></button>`).join('')}<button class="cand" onclick="closeS();go('nut')">None of these — search instead</button>
<label>Portion (estimate)</label><div class="row">${[['Small',.75],['Medium',1],['Large',1.3]].map(([l,v])=>`<span class="chip ${sc.mul==v?'on':''}" onclick="sc.mul=${v};review()">${l}</span>`).join('')}</div>
<p style="margin:12px 0"><b>${Math.round(c[sc.sel].x[3]*sc.mul)} g protein</b> · ${Math.round(c[sc.sel].x[4]*sc.mul)} g fibre${S.hk?'':' · '+Math.round(c[sc.sel].x[2]*sc.mul)+' kcal'} <span class="tag">estimated · demo</span></p>${c[sc.sel].x[6].some(a=>S.al.includes(a))?'<p style="color:#c0392b">⚠ Contains an allergen you listed.</p>':''}<button class="btn" onclick="closeS();log(sc.c[sc.sel].x,sc.mul,'photo')">Log this meal</button>`)}
document.documentElement.dataset.t=S.th;document.body.classList.toggle('rm',S.rm);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
go('today');if(!S.p.name)setTimeout(profile,500);
</script></body></html>
